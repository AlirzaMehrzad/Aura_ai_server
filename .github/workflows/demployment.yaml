name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Triggers when you push or merge to the main branch

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

