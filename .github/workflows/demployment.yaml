name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

  deploy:
    name: Deploy to EC2
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to the app directory
            cd /home/ubuntu/Aura_ai_server

            # Pull the latest code
            git pull origin master

            # Install any new dependencies
            /home/ubuntu/.bun/bin/bun install

            # Generate Prisma & Migrate database
            /home/ubuntu/.bun/bin/bunx prisma generate
            /home/ubuntu/.bun/bin/bunx prisma migrate deploy

            # Restart the PM2 process using the absolute path
            /home/ubuntu/.bun/bin/pm2 restart rag-server
